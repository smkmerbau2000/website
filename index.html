<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration System</title>
    <!-- Include Supabase JS Library -->
    <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --border: #e5e7eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 2rem 1rem;
            line-height: 1.5;
        }

        .container { max-width: 900px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 2rem; }
        header h1 { color: var(--primary); font-size: 2.2rem; }

        /* Connection Badge Styling */
        #conn-check {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            background: #e5e7eb;
            color: #4b5563;
        }
        .conn-success { background: #d1fae5 !important; color: #065f46 !important; }
        .conn-failed { background: #fee2e2 !important; color: #991b1b !important; }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }
        @media (min-width: 768px) {
            .main-layout { grid-template-columns: 1fr 1.5fr; }
        }

        .box {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        h2 { font-size: 1.25rem; margin-bottom: 1.2rem; padding-bottom: 0.5rem; border-bottom: 2px solid var(--border); }
        
        .form-group { margin-bottom: 1rem; }
        label { display: block; font-weight: 500; margin-bottom: 0.4rem; font-size: 0.9rem; }
        input, select {
            width: 100%; padding: 0.6rem; border: 1px solid var(--border);
            border-radius: 6px; font-size: 1rem; outline: none;
        }
        input:focus, select:focus { border-color: var(--primary); }

        button {
            width: 100%; background: var(--primary); color: white; border: none;
            padding: 0.7rem; border-radius: 6px; font-size: 1rem; font-weight: 600;
            cursor: pointer; transition: background 0.2s;
        }
        button:hover { background: var(--primary-hover); }

        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.95rem; }
        th, td { padding: 0.75rem; border-bottom: 1px solid var(--border); }
        th { background: #f9fafb; font-weight: 600; }
        
        .status-msg {
            padding: 0.5rem; margin-bottom: 1rem; border-radius: 4px;
            font-size: 0.9rem; display: none; text-align: center;
        }
        .status-success { background: #d1fae5; color: #065f46; display: block; }
        .status-error { background: #fee2e2; color: #991b1b; display: block; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Student Registry</h1>
        <p>Manage database records securely via Supabase</p>
        <!-- The Live Connection Badge -->
        <div id="conn-check">Checking connection to Supabase...</div>
    </header>

    <div class="main-layout">
        <!-- Registration Form -->
        <div class="box">
            <h2>Register New Student</h2>
            <div id="status" class="status-msg"></div>
            <form id="regForm">
                <div class="form-group">
                    <label for="studentId">Student ID / Matric No.</label>
                    <input type="text" id="studentId" required placeholder="e.g. STU1023">
                </div>
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label for="course">Course / Major</label>
                    <select id="course" required>
                        <option value="">Select Course</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Information Technology">Information Technology</option>
                        <option value="Data Science">Data Science</option>
                        <option value="Business Administration">Business Administration</option>
                    </select>
                </div>
                <button type="submit">Submit Registration</button>
            </form>
        </div>

        <!-- Registered Students Directory -->
        <div class="box">
            <h2>Registered Directory</h2>
            <div class="table-container">
                <table id="studentTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Course</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="3" style="text-align:center;">Loading students...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>

    const SUPABASE_URL = 'https://supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qc3Ftc2Vzd2d5cGZsemRoaXFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExOTU0NzgsImV4cCI6MjEwNjc3MTQ3OH0.OnmJV4uWB2e-VsMiI4mgiEr36nDeBedELAIURQViovg';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // DOM Elements
    const regForm = document.getElementById('regForm');
    const studentTableBody = document.querySelector('#studentTable tbody');
    const statusDiv = document.getElementById('status');
    const connCheckDiv = document.getElementById('conn-check');

    // NEW SIMPLE CONNECTION TESTER FUNCTION
    async function testConnection() {
        try {
            // Attempt to make a simple diagnostic call to your database project settings
            const { data, error } = await supabase.from('students').select('id').limit(1);
            
            if (error) {
                // Connection made, but database returned a schema or permission block
                connCheckDiv.textContent = `❌ Database Error: ${error.message}`;
                connCheckDiv.className = 'conn-failed';
                console.error("Supabase Error Context:", error);
            } else {
                // Complete handshake achieved successfully
                connCheckDiv.textContent = "🟢 Connected to Supabase Successfully!";
                connCheckDiv.className = 'conn-success';
            }
        } catch (err) {
            // Hard network failure (wrong URL format or script library crashed)
            connCheckDiv.textContent = `❌ Network Error: Could not reach Supabase server`;
            connCheckDiv.className = 'conn-failed';
            console.error("Network Error Context:", err);
        }
    }

    // 2. FETCH AND DISPLAY STUDENTS
    async function fetchStudents() {
        const { data, error } = await supabase
            .from('students')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            studentTableBody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:red;">Failed to load data.</td></tr>`;
            return;
        }

        if (data.length === 0) {
            studentTableBody.innerHTML = `<tr><td colspan="3" style="text-align:center;">No students registered yet.</td></tr>`;
            return;
        }

        studentTableBody.innerHTML = '';
        data.forEach(student => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><strong>${escapeHtml(student.student_id)}</strong></td>
                <td>${escapeHtml(student.full_name)}<br><small style="color:gray">${escapeHtml(student.email)}</small></td>
                <td>${escapeHtml(student.course)}</td>
            `;
            studentTableBody.appendChild(row);
        });
    }

    regForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        showStatus('Submitting details...', '');

        const full_name = document.getElementById('fullName').value;
        const email = document.getElementById('email').value;
