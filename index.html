<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Student Registry System powered by Supabase"
    >

    <title>Student Registry System</title>

    <!-- Supabase JavaScript Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Application CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <main class="page">

        <div class="container">

            <!-- PAGE HEADER -->
            <header class="page-header">

                <h1 class="page-title">
                    Student Registry System
                </h1>

                <p class="page-subtitle">
                    Live Database Records Directory Viewer
                </p>

                <div
                    id="connectionStatus"
                    class="connection-status loading"
                    role="status"
                    aria-live="polite"
                >
                    <span>●</span>

                    <span id="connectionMessage">
                        Connecting to Supabase...
                    </span>
                </div>

            </header>


            <!-- DIRECTORY -->
            <section
                class="directory-card"
                aria-labelledby="directoryTitle"
            >

                <div class="directory-header">

                    <div class="directory-heading">

                        <h2 id="directoryTitle">
                            Active Directory
                        </h2>

                        <p>
                            Student records from Supabase
                        </p>

                    </div>

                    <div
                        id="studentCounter"
                        class="counter"
                    >
                        0 Students
                    </div>

                </div>


                <!-- STUDENT TABLE -->
                <div class="table-container">

                    <table
                        id="studentTable"
                        class="student-table"
                    >

                        <thead>

                            <tr>

                                <th scope="col">
                                    Student ID
                                </th>

                                <th scope="col">
                                    Student Profile
                                </th>

                                <th scope="col">
                                    Enrolled Course
                                </th>

                            </tr>

                        </thead>


                        <tbody id="studentTableBody">

                            <tr>

                                <td
                                    colspan="3"
                                    class="table-state"
                                >

                                    <span
                                        class="loading-spinner"
                                    ></span>

                                    Loading student records...

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </section>


            <!-- FOOTER -->
            <footer class="footer">
                Student Registry System • Powered by Supabase
            </footer>

        </div>

    </main>


    <!-- Application configuration -->
    <script src="js/config.js"></script>

    <!-- Application JavaScript -->
    <script src="js/app.js"></script>

</body>

</html>
