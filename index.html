<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Student Registry System - Live Student Directory"
    >

    <title>Student Registry System</title>

    <style>
        /* ==============================
           CSS VARIABLES
        ============================== */

        :root {
            --primary: #00b377;
            --primary-dark: #009963;
            --primary-light: #d1fae5;

            --background: #f3f4f6;
            --surface: #ffffff;

            --text: #1f2937;
            --text-muted: #6b7280;

            --border: #e5e7eb;

            --success-bg: #d1fae5;
            --success-text: #065f46;

            --error-bg: #fee2e2;
            --error-text: #991b1b;

            --shadow:
                0 10px 15px -3px rgba(0, 0, 0, 0.05),
                0 4px 6px -4px rgba(0, 0, 0, 0.05);

            --radius: 12px;
        }


        /* ==============================
           RESET
        ============================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* ==============================
           BASE
        ============================== */

        body {
            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background: var(--background);
            color: var(--text);

            line-height: 1.5;
        }


        /* ==============================
           PAGE LAYOUT
        ============================== */

        .page {
            width: 100%;
            padding: 48px 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }


        /* ==============================
           HEADER
        ============================== */

        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-title {
            color: var(--primary);
            font-size: clamp(2rem, 5vw, 2.75rem);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .page-subtitle {
            color: var(--text-muted);
            font-size: 1.05rem;
        }


        /* ==============================
           CONNECTION STATUS
        ============================== */

        .connection-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            margin-top: 16px;
            padding: 7px 16px;

            border-radius: 999px;

            background: #e5e7eb;
            color: #4b5563;

            font-size: 0.85rem;
            font-weight: 600;

            transition:
                background-color 0.2s ease,
                color 0.2s ease;
        }

        .connection-status.success {
            background: var(--success-bg);
            color: var(--success-text);
        }

        .connection-status.error {
            background: var(--error-bg);
            color: var(--error-text);
        }


        /* ==============================
           DIRECTORY CARD
        ============================== */

        .directory-card {
            background: var(--surface);

            border: 1px solid var(--border);
            border-radius: var(--radius);

            box-shadow: var(--shadow);

            overflow: hidden;
        }


        /* ==============================
           DIRECTORY HEADER
        ============================== */

        .directory-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;

            padding: 24px;

            border-bottom: 1px solid var(--border);
        }

        .directory-title {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .directory-description {
            margin-top: 4px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }


        /* ==============================
           COUNTER
        ============================== */

        .student-counter {
            flex-shrink: 0;

            padding: 6px 14px;

            border-radius: 999px;

            background: var(--primary);
            color: white;

            font-size: 0.85rem;
            font-weight: 700;
        }


        /* ==============================
           TABLE
        ============================== */

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        .student-table {
            width: 100%;
            border-collapse: collapse;

            text-align: left;
        }

        .student-table th,
        .student-table td {
            padding: 16px 20px;

            border-bottom: 1px solid var(--border);

            vertical-align: middle;
        }

        .student-table th {
            background: #f9fafb;

            color: #374151;

            font-size: 0.85rem;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 0.025em;
        }

        .student-table td {
            font-size: 0.95rem;
        }

        .student-table tbody tr {
            transition: background-color 0.15s ease;
        }

        .student-table tbody tr:hover {
            background: #f9fafb;
        }

        .student-table tbody tr:last-child td {
            border-bottom: none;
        }


        /* ==============================
           STUDENT INFORMATION
        ============================== */

        .student-id {
            color: var(--text);
            font-weight: 700;
            white-space: nowrap;
        }

        .student-name {
            color: var(--text);
            font-weight: 600;
        }

        .student-email {
            display: block;

            margin-top: 2px;

            color: var(--text-muted);

            font-size: 0.85rem;
        }

        .course {
            color: var(--primary-dark);
            font-weight: 600;
        }


        /* ==============================
           LOADING / EMPTY / ERROR
        ============================== */

        .table-message {
            padding: 48px 20px !important;

            text-align: center;

            color: var(--text-muted);
        }

        .table-message.error {
            color: var(--error-text);
        }


        /* ==============================
           FOOTER
        ============================== */

        .page-footer {
            margin-top: 24px;

            text-align: center;

            color: var(--text-muted);

            font-size: 0.8rem;
        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 600px) {

            .page {
                padding: 32px 12px;
            }

            .page-header {
                margin-bottom: 28px;
            }

            .directory-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .student-counter {
                align-self: flex-start;
            }

            .student-table {
                min-width: 650px;
            }
        }
    </style>
</head>


<body>

    <main class="page">

        <div class="container">

            <!-- ==========================
                 PAGE HEADER
            =========================== -->

            <header class="page-header">

                <h1 class="page-title">
                    Student Registry System
                </h1>

                <p class="page-subtitle">
                    Live Database Records Directory Viewer
                </p>

                <div
                    id="connectionStatus"
                    class="connection-status"
                    role="status"
                    aria-live="polite"
                >
                    <span>●</span>
                    <span id="connectionText">
                        Connecting to API...
                    </span>
                </div>

            </header>


            <!-- ==========================
                 DIRECTORY
            =========================== -->

            <section
                class="directory-card"
                aria-labelledby="directoryTitle"
            >

                <div class="directory-header">

                    <div>
                        <h2
                            id="directoryTitle"
                            class="directory-title"
                        >
                            Active Directory
                        </h2>

                        <p class="directory-description">
                            Currently enrolled students
                        </p>
                    </div>

                    <div
                        id="studentCounter"
                        class="student-counter"
                    >
                        0 Students
                    </div>

                </div>


                <!-- ==========================
                     TABLE
                =========================== -->

                <div class="table-wrapper">

                    <table class="student-table">

                        <thead>
                            <tr>
                                <th scope="col">
                                    Student ID
                                </th>

                                <th scope="col">
                                    Student Profile
                                </th>

                                <th scope="col">
                                    Enrolled Course
                                </th>
                            </tr>
                        </thead>

                        <tbody id="studentTableBody">

                            <tr>
                                <td
                                    colspan="3"
                                    class="table-message"
                                >
                                    Loading student records...
                                </td>
                            </tr>

                        </tbody>

                    </table>

                </div>

            </section>


            <!-- ==========================
                 FOOTER
            =========================== -->

            <footer class="page-footer">
                Student Registry System
            </footer>

        </div>

    </main>


    <!-- ==============================
         JAVASCRIPT
    ============================== -->

    <script>

        /* =================================
           CONFIGURATION
        ================================= */

        const API_URL =
            'https://jsonplaceholder.typicode.com/users';


        /* =================================
           DOM ELEMENTS
        ================================= */

        const studentTableBody =
            document.getElementById('studentTableBody');

        const connectionStatus =
            document.getElementById('connectionStatus');

        const connectionText =
            document.getElementById('connectionText');

        const studentCounter =
            document.getElementById('studentCounter');


        /* =================================
           CONNECTION STATUS
        ================================= */

        function setConnectionStatus(
            type,
            message
        ) {

            connectionStatus.classList.remove(
                'success',
                'error'
            );

            if (type === 'success') {
                connectionStatus.classList.add('success');
            }

            if (type === 'error') {
                connectionStatus.classList.add('error');
            }

            connectionText.textContent = message;
        }


        /* =================================
           ESCAPE HTML
        ================================= */

        function escapeHtml(value) {

            if (value === null || value === undefined) {
                return '';
            }

            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }


        /* =================================
           UPDATE COUNTER
        ================================= */

        function updateCounter(count) {

            studentCounter.textContent =
                `${count} Student${count === 1 ? '' : 's'}`;
        }


        /* =================================
           SHOW LOADING
        ================================= */

        function showLoading() {

            studentTableBody.innerHTML = `
                <tr>
                    <td
                        colspan="3"
                        class="table-message"
                    >
                        Loading student records...
                    </td>
                </tr>
            `;
        }


        /* =================================
           SHOW ERROR
        ================================= */

        function showError(message) {

            studentTableBody.innerHTML = `
                <tr>
                    <td
                        colspan="3"
                        class="table-message error"
                    >
                        ${escapeHtml(message)}
                    </td>
                </tr>
            `;

            updateCounter(0);
        }


        /* =================================
           RENDER STUDENTS
        ================================= */

        function renderStudents(students) {

            if (!students.length) {

                studentTableBody.innerHTML = `
                    <tr>
                        <td
                            colspan="3"
                            class="table-message"
                        >
                            No student records found.
                        </td>
                    </tr>
                `;

                updateCounter(0);

                return;
            }


            updateCounter(students.length);


            studentTableBody.innerHTML =
                students.map(student => `

                    <tr>

                        <td>
                            <span class="student-id">
                                ${escapeHtml(student.student_id)}
                            </span>
                        </td>


                        <td>

                            <span class="student-name">
                                ${escapeHtml(student.full_name)}
                            </span>

                            <span class="student-email">
                                ${escapeHtml(student.email)}
                            </span>

                        </td>


                        <td>

                            <span class="course">
                                ${escapeHtml(student.course)}
                            </span>

                        </td>

                    </tr>

                `).join('');
        }


        /* =================================
           FETCH STUDENTS
        ================================= */

        async function fetchStudents() {

            showLoading();

            setConnectionStatus(
                'default',
                'Connecting to API...'
            );


            try {

                const response =
                    await fetch(API_URL);


                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );
                }


                const users =
                    await response.json();


                /*
                 * Convert API users into
                 * student records.
                 */

                const students =
                    users.map((user, index) => ({

                        student_id:
                            `STU-2026-${1000 + user.id}`,

                        full_name:
                            user.name,

                        email:
                            user.email.toLowerCase(),

                        course:
                            index % 2 === 0
                                ? 'Computer Science Engineering'
                                : 'Data Analytics & Statistics'

                    }));


                setConnectionStatus(
                    'success',
                    'Connected to API successfully'
                );


                renderStudents(students);


            } catch (error) {

                console.error(
                    'Student API Error:',
                    error
                );


                setConnectionStatus(
                    'error',
                    'Unable to connect to API'
                );


                showError(
                    'Could not load student records. Please try again.'
                );

            }

        }


        /* =================================
           INITIALIZE APPLICATION
        ================================= */

        document.addEventListener(
            'DOMContentLoaded',
            fetchStudents
        );

    </script>

</body>
</html>
