<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Student Registry System powered by Supabase"
    >

    <title>Student Registry System</title>

    <!-- Supabase JavaScript Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* =====================================================
           VARIABLES
        ===================================================== */

        :root {
            --primary: #00b377;
            --primary-dark: #008f61;
            --primary-light: #d1fae5;

            --background: #f3f4f6;
            --surface: #ffffff;

            --text: #1f2937;
            --muted: #6b7280;

            --border: #e5e7eb;

            --success-bg: #d1fae5;
            --success-text: #065f46;

            --error-bg: #fee2e2;
            --error-text: #991b1b;

            --warning-bg: #fef3c7;
            --warning-text: #92400e;

            --radius: 12px;

            --shadow:
                0 10px 25px rgba(0, 0, 0, 0.05);
        }


        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =====================================================
           BODY
        ===================================================== */

        body {
            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background: var(--background);
            color: var(--text);

            line-height: 1.5;
        }


        /* =====================================================
           PAGE
        ===================================================== */

        .page {
            min-height: 100vh;
            padding: 48px 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .page-header {
            text-align: center;
            margin-bottom: 36px;
        }

        .page-title {
            margin-bottom: 8px;

            color: var(--primary);

            font-size: clamp(2rem, 5vw, 2.7rem);
            font-weight: 700;
        }

        .page-subtitle {
            color: var(--muted);
            font-size: 1rem;
        }


        /* =====================================================
           CONNECTION STATUS
        ===================================================== */

        .connection-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            margin-top: 16px;
            padding: 7px 15px;

            border-radius: 999px;

            background: #e5e7eb;
            color: #4b5563;

            font-size: 0.85rem;
            font-weight: 600;

            transition:
                background-color 0.2s ease,
                color 0.2s ease;
        }

        .connection-status.loading {
            background: var(--warning-bg);
            color: var(--warning-text);
        }

        .connection-status.success {
            background: var(--success-bg);
            color: var(--success-text);
        }

        .connection-status.error {
            background: var(--error-bg);
            color: var(--error-text);
        }


        /* =====================================================
           DIRECTORY CARD
        ===================================================== */

        .directory-card {
            background: var(--surface);

            border: 1px solid var(--border);
            border-radius: var(--radius);

            box-shadow: var(--shadow);

            overflow: hidden;
        }


        /* =====================================================
           DIRECTORY HEADER
        ===================================================== */

        .directory-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            padding: 24px;

            border-bottom: 1px solid var(--border);
        }

        .directory-heading h2 {
            margin-bottom: 4px;

            font-size: 1.4rem;
            font-weight: 700;
        }

        .directory-heading p {
            color: var(--muted);
            font-size: 0.9rem;
        }


        /* =====================================================
           COUNTER
        ===================================================== */

        .counter {
            flex-shrink: 0;

            padding: 6px 14px;

            background: var(--primary);
            color: white;

            border-radius: 999px;

            font-size: 0.85rem;
            font-weight: 700;
        }


        /* =====================================================
           TABLE
        ===================================================== */

        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        .student-table {
            width: 100%;
            min-width: 650px;

            border-collapse: collapse;

            text-align: left;
        }

        .student-table th,
        .student-table td {
            padding: 16px 20px;

            border-bottom: 1px solid var(--border);

            vertical-align: middle;
        }

        .student-table th {
            background: #f9fafb;

            color: #374151;

            font-size: 0.8rem;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .student-table tbody tr {
            transition: background-color 0.15s ease;
        }

        .student-table tbody tr:hover {
            background: #f9fafb;
        }

        .student-table tbody tr:last-child td {
            border-bottom: none;
        }


        /* =====================================================
           STUDENT INFORMATION
        ===================================================== */

        .student-id {
            color: var(--text);
            font-weight: 700;
            white-space: nowrap;
        }

        .student-name {
            display: block;

            color: var(--text);
            font-weight: 600;
        }

        .student-email {
            display: block;

            margin-top: 2px;

            color: var(--muted);

            font-size: 0.85rem;
        }

        .student-course {
            color: var(--primary-dark);
            font-weight: 600;
        }


        /* =====================================================
           TABLE STATES
        ===================================================== */

        .table-state {
            padding: 50px 20px !important;

            text-align: center;

            color: var(--muted);
        }

        .table-state.error {
            color: var(--error-text);
        }


        /* =====================================================
           LOADING SPINNER
        ===================================================== */

        .loading-spinner {
            display: inline-block;

            width: 20px;
            height: 20px;

            margin-right: 8px;

            border: 3px solid #d1d5db;
            border-top-color: var(--primary);

            border-radius: 50%;

            vertical-align: middle;

            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .footer {
            margin-top: 24px;

            text-align: center;

            color: var(--muted);

            font-size: 0.8rem;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .page {
                padding: 30px 12px;
            }

            .directory-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .counter {
                align-self: flex-start;
            }
        }
    </style>
</head>


<body>

    <main class="page">

        <div class="container">


            <!-- =================================================
                 PAGE HEADER
            ================================================== -->

            <header class="page-header">

                <h1 class="page-title">
                    Student Registry System
                </h1>

                <p class="page-subtitle">
                    Live Database Records Directory Viewer
                </p>

                <div
                    id="connectionStatus"
                    class="connection-status loading"
                    role="status"
                    aria-live="polite"
                >
                    <span>●</span>

                    <span id="connectionMessage">
                        Connecting to Supabase...
                    </span>
                </div>

            </header>


            <!-- =================================================
                 DIRECTORY
            ================================================== -->

            <section
                class="directory-card"
                aria-labelledby="directoryTitle"
            >

                <div class="directory-header">

                    <div class="directory-heading">

                        <h2 id="directoryTitle">
                            Active Directory
                        </h2>

                        <p>
                            Student records from Supabase
                        </p>

                    </div>


                    <div
                        id="studentCounter"
                        class="counter"
                    >
                        0 Students
                    </div>

                </div>


                <!-- =================================================
                     STUDENT TABLE
                ================================================== -->

                <div class="table-container">

                    <table
                        id="studentTable"
                        class="student-table"
                    >

                        <thead>

                            <tr>

                                <th scope="col">
                                    Student ID
                                </th>

                                <th scope="col">
                                    Student Profile
                                </th>

                                <th scope="col">
                                    Enrolled Course
                                </th>

                            </tr>

                        </thead>


                        <tbody id="studentTableBody">

                            <tr>

                                <td
                                    colspan="3"
                                    class="table-state"
                                >

                                    <span
                                        class="loading-spinner"
                                    ></span>

                                    Loading student records...

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </section>


            <!-- =================================================
                 FOOTER
            ================================================== -->

            <footer class="footer">
                Student Registry System • Powered by Supabase
            </footer>

        </div>

    </main>


    <!-- =========================================================
         SUPABASE + APPLICATION JAVASCRIPT
    ========================================================== -->

    <script>

        /* =====================================================
           SUPABASE CONFIGURATION
           -----------------------------------------------------
           Replace these two values with your Supabase project
           information.

           IMPORTANT:
           Use the PUBLISHABLE/ANON key here.

           NEVER use the Supabase service_role/secret key
           in this HTML file.
        ===================================================== */

        const SUPABASE_URL =
            "https://pxvrmuxvqozmpombctxt.supabase.co";

        const SUPABASE_KEY =
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB4dnJtdXh2cW96bXBvbWJjdHh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyODkxMDksImV4cCI6MjEwNjg2NTEwOX0.uLA2OlxqSSiIemF9aRTn0W_fAT5C7sW4qntn0JZ5FxM";


        /* =====================================================
           DATABASE CONFIGURATION
        ===================================================== */

        const TABLE_NAME = "students";


        /* =====================================================
           CREATE SUPABASE CLIENT
        ===================================================== */

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* =====================================================
           DOM ELEMENTS
        ===================================================== */

        const tableBody =
            document.getElementById(
                "studentTableBody"
            );

        const counter =
            document.getElementById(
                "studentCounter"
            );

        const connectionStatus =
            document.getElementById(
                "connectionStatus"
            );

        const connectionMessage =
            document.getElementById(
                "connectionMessage"
            );


        /* =====================================================
           CONNECTION STATUS
        ===================================================== */

        function setConnectionStatus(
            type,
            message
        ) {

            connectionStatus.classList.remove(
                "loading",
                "success",
                "error"
            );

            connectionStatus.classList.add(type);

            connectionMessage.textContent =
                message;
        }


        /* =====================================================
           UPDATE COUNTER
        ===================================================== */

        function updateCounter(total) {

            counter.textContent =
                `${total} Student${total === 1 ? "" : "s"}`;
        }


        /* =====================================================
           HTML ESCAPING
        ===================================================== */

        function escapeHtml(value) {

            if (
                value === null ||
                value === undefined
            ) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        /* =====================================================
           LOADING STATE
        ===================================================== */

        function showLoading() {

            tableBody.innerHTML = `

                <tr>

                    <td
                        colspan="3"
                        class="table-state"
                    >

                        <span
                            class="loading-spinner"
                        ></span>

                        Loading student records...

                    </td>

                </tr>

            `;
        }


        /* =====================================================
           ERROR STATE
        ===================================================== */

        function showError(message) {

            tableBody.innerHTML = `

                <tr>

                    <td
                        colspan="3"
                        class="table-state error"
                    >

                        ${escapeHtml(message)}

                    </td>

                </tr>

            `;

            updateCounter(0);
        }


        /* =====================================================
           EMPTY STATE
        ===================================================== */

        function showEmptyState() {

            tableBody.innerHTML = `

                <tr>

                    <td
                        colspan="3"
                        class="table-state"
                    >

                        No student records found.

                    </td>

                </tr>

            `;

            updateCounter(0);
        }


        /* =====================================================
           RENDER STUDENTS
        ===================================================== */

        function renderStudents(students) {

            if (
                !Array.isArray(students)
            ) {

                throw new Error(
                    "Invalid student data."
                );
            }


            if (
                students.length === 0
            ) {

                showEmptyState();

                return;
            }


            updateCounter(
                students.length
            );


            tableBody.innerHTML = "";


            students.forEach(student => {

                const row =
                    document.createElement("tr");


                row.innerHTML = `

                    <td>

                        <span class="student-id">
                            ${escapeHtml(
                                student.student_id
                            )}
                        </span>

                    </td>


                    <td>

                        <span class="student-name">
                            ${escapeHtml(
                                student.full_name
                            )}
                        </span>

                        <span class="student-email">
                            ${escapeHtml(
                                student.email
                            )}
                        </span>

                    </td>


                    <td>

                        <span class="student-course">
                            ${escapeHtml(
                                student.course
                            )}
                        </span>

                    </td>

                `;


                tableBody.appendChild(row);

            });
        }


        /* =====================================================
           GET STUDENTS FROM SUPABASE
        ===================================================== */

        async function fetchStudents() {

            showLoading();


            setConnectionStatus(
                "loading",
                "Connecting to Supabase..."
            );


            try {

                const {
                    data,
                    error
                } = await supabaseClient

                    .from(TABLE_NAME)

                    .select(
                        "student_id, full_name, email, course"
                    )

                    .order(
                        "student_id",
                        {
                            ascending: true
                        }
                    );


                /* ---------------------------------------------
                   SUPABASE ERROR
                --------------------------------------------- */

                if (error) {

                    throw error;
                }


                /* ---------------------------------------------
                   RENDER DATABASE DATA
                --------------------------------------------- */

                renderStudents(data);


                /* ---------------------------------------------
                   SUCCESS
                --------------------------------------------- */

                setConnectionStatus(
                    "success",
                    "Connected to Supabase"
                );


            } catch (error) {

                console.error(
                    "Supabase error:",
                    error
                );


                setConnectionStatus(
                    "error",
                    "Supabase connection failed"
                );


                showError(
                    "Unable to load student records."
                );

            }

        }


        /* =====================================================
           INITIALIZE
        ===================================================== */

        document.addEventListener(
            "DOMContentLoaded",
            fetchStudents
        );

    </script>

</body>
</html>
