<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Directory Dashboard</title>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --primary: #4f46e5;
            --border: #e5e7eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 3rem 1rem;
            line-height: 1.5;
        }

        .container { max-width: 800px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 2.5rem; }
        header h1 { color: var(--primary); font-size: 2.5rem; margin-bottom: 0.5rem; }
        header p { opacity: 0.7; font-size: 1.1rem; }

        #conn-check {
            display: inline-block;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            margin-top: 1rem;
            background: #e5e7eb;
            color: #4b5563;
        }
        .conn-success { background: #d1fae5 !important; color: #065f46 !important; }
        .conn-failed { background: #fee2e2 !important; color: #991b1b !important; }

        .directory-box {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }
        
        .directory-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid var(--border);
        }
        .directory-header h2 { font-size: 1.5rem; }
        .counter-badge {
            background: var(--primary);
            color: white;
            padding: 0.2rem 0.75rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 1rem; }
        th, td { padding: 1rem; border-bottom: 1px solid var(--border); }
        th { background: #f9fafb; font-weight: 600; color: #374151; }
        tr:hover { background-color: #f9fafb; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Student Registry System</h1>
        <p>Live Database Records Directory Viewer</p>
        <div id="conn-check">Connecting to data stream...</div>
    </header>

    <div class="directory-box">
        <div class="directory-header">
            <h2>Active Directory</h2>
            <div id="student-counter" class="counter-badge">0 Students</div>
        </div>

        <div class="table-container">
            <table id="studentTable">
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Student Profile Details</th>
                        <th>Enrolled Course</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="3" style="text-align:center; padding: 2rem; color: #6b7280;">
                            Initializing connection and loading profiles...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modern modular ES integration block that bypasses window attachment limitations -->
<script type="module">
    import { createClient } from 'https://jsdelivr.net';

    const SUPABASE_URL = 'https://mjsqmseswgypflzdhiqc.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qc3Ftc2Vzd2d5cGZsemRoaXFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExOTU0NzgsImV4cCI6MjEwNjc3MTQ3OH0.OnmJV4uWB2e-VsMiI4mgiEr36nDeBedELAIURQViovg';

    // Safe modular instantiation initialization
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const studentTableBody = document.querySelector('#studentTable tbody');
    const connCheckDiv = document.getElementById('conn-check');
    const counterBadge = document.getElementById('student-counter');

    async function fetchAndRenderDirectory() {
        try {
            const { data, error } = await supabase
                .from('students')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                connCheckDiv.textContent = `❌ Database Sync Failed: ${error.message}`;
                connCheckDiv.className = 'conn-failed';
                studentTableBody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:red; padding: 2rem;">Could not read database layout map.</td></tr>`;
                return;
            }

            connCheckDiv.textContent = "🟢 Connected live to Supabase Data Layer";
            connCheckDiv.className = 'conn-success';

            if (!data || data.length === 0) {
                counterBadge.textContent = "0 Students";
                studentTableBody.innerHTML = `<tr><td colspan="3" style="text-align:center; padding: 2rem;">No students registered in database yet.</td></tr>`;
                return;
            }

            counterBadge.textContent = `${data.length} Student${data.length > 1 ? 's' : ''}`;

            studentTableBody.innerHTML = '';
            data.forEach(student => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${escapeHtml(student.student_id)}</strong></td>
                    <td>
                        <span style="font-weight: 500;">${escapeHtml(student.full_name)}</span><br>
                        <small style="color: #6b7280;">${escapeHtml(student.email)}</small>
                    </td>
                    <td><span style="color: #4f46e5; font-weight: 500;">${escapeHtml(student.course)}</span></td>
                `;
                studentTableBody.appendChild(row);
            });

        } catch (catchErr) {
            connCheckDiv.textContent = "❌ Network Link Broken";
            connCheckDiv.className = 'conn-failed';
            studentTableBody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:red; padding: 2rem;">Fatal connectivity interruption.</td></tr>`;
            console.error(catchErr);
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.toString()
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    fetchAndRenderDirectory();
</script>
</body>
</html>
