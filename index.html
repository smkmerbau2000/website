<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Student Registry System powered by Supabase"
    >

    <title>Student Registry System</title>

    <!-- Supabase JavaScript Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="css/styles.css">
</head><body>

    <main class="page">

        <div class="container">


            <!-- =================================================
                 PAGE HEADER
            ================================================== -->

            <header class="page-header">

                <h1 class="page-title">
                    Student Registry System
                </h1>

                <p class="page-subtitle">
                    Live Database Records Directory Viewer
                </p>

                <div
                    id="connectionStatus"
                    class="connection-status loading"
                    role="status"
                    aria-live="polite"
                >
                    <span>●</span>

                    <span id="connectionMessage">
                        Connecting to Supabase...
                    </span>
                </div>

            </header>


            <!-- =================================================
                 DIRECTORY
            ================================================== -->

            <section
                class="directory-card"
                aria-labelledby="directoryTitle"
            >

                <div class="directory-header">

                    <div class="directory-heading">

                        <h2 id="directoryTitle">
                            Active Directory
                        </h2>

                        <p>
                            Student records from Supabase
                        </p>

                    </div>


                    <div
                        id="studentCounter"
                        class="counter"
                    >
                        0 Students
                    </div>

                </div>


                <!-- =================================================
                     STUDENT TABLE
                ================================================== -->

                <div class="table-container">

                    <table
                        id="studentTable"
                        class="student-table"
                    >

                        <thead>

                            <tr>

                                <th scope="col">
                                    Student ID
                                </th>

                                <th scope="col">
                                    Student Profile
                                </th>

                                <th scope="col">
                                    Enrolled Course
                                </th>

                            </tr>

                        </thead>


                        <tbody id="studentTableBody">

                            <tr>

                                <td
                                    colspan="3"
                                    class="table-state"
                                >

                                    <span
                                        class="loading-spinner"
                                    ></span>

                                    Loading student records...

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </section>


            <!-- =================================================
                 FOOTER
            ================================================== -->

            <footer class="footer">
                Student Registry System • Powered by Supabase
            </footer>

        </div>

    </main>


    <!-- =========================================================
         SUPABASE + APPLICATION JAVASCRIPT
    ========================================================== -->

    <script>

        /* =====================================================
           SUPABASE CONFIGURATION
           -----------------------------------------------------
           Replace these two values with your Supabase project
           information.

           IMPORTANT:
           Use the PUBLISHABLE/ANON key here.

           NEVER use the Supabase service_role/secret key
           in this HTML file.
        ===================================================== */

        const SUPABASE_URL =
            "https://mjsqmseswgypflzdhiqc.supabase.co";

        const SUPABASE_KEY =
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qc3Ftc2Vzd2d5cGZsemRoaXFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExOTU0NzgsImV4cCI6MjEwNjc3MTQ3OH0.OnmJV4uWB2e-VsMiI4mgiEr36nDeBedELAIURQViovg";


        /* =====================================================
           DATABASE CONFIGURATION
        ===================================================== */

        const TABLE_NAME = "students";


        /* =====================================================
           CREATE SUPABASE CLIENT
        ===================================================== */

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* =====================================================
           DOM ELEMENTS
        ===================================================== */

        const tableBody =
            document.getElementById(
                "studentTableBody"
            );

        const counter =
            document.getElementById(
                "studentCounter"
            );

        const connectionStatus =
            document.getElementById(
                "connectionStatus"
            );

        const connectionMessage =
            document.getElementById(
                "connectionMessage"
            );


        /* =====================================================
           CONNECTION STATUS
        ===================================================== */

        function setConnectionStatus(
            type,
            message
        ) {

            connectionStatus.classList.remove(
                "loading",
                "success",
                "error"
            );

            connectionStatus.classList.add(type);

            connectionMessage.textContent =
                message;
        }


        /* =====================================================
           UPDATE COUNTER
        ===================================================== */

        function updateCounter(total) {

            counter.textContent =
                `${total} Student${total === 1 ? "" : "s"}`;
        }


        /* =====================================================
           HTML ESCAPING
        ===================================================== */

        function escapeHtml(value) {

            if (
                value === null ||
                value === undefined
            ) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        /* =====================================================
           LOADING STATE
        ===================================================== */

        function showLoading() {

            tableBody.innerHTML = `

                <tr>

                    <td
                        colspan="3"
                        class="table-state"
                    >

                        <span
                            class="loading-spinner"
                        ></span>

                        Loading student records...

                    </td>

                </tr>

            `;
        }


        /* =====================================================
           ERROR STATE
        ===================================================== */

        function showError(message) {

            tableBody.innerHTML = `

                <tr>

                    <td
                        colspan="3"
                        class="table-state error"
                    >

                        ${escapeHtml(message)}

                    </td>

                </tr>

            `;

            updateCounter(0);
        }


        /* =====================================================
           EMPTY STATE
        ===================================================== */

        function showEmptyState() {

            tableBody.innerHTML = `

                <tr>

                    <td
                        colspan="3"
                        class="table-state"
                    >

                        No student records found.

                    </td>

                </tr>

            `;

            updateCounter(0);
        }


        /* =====================================================
           RENDER STUDENTS
        ===================================================== */

        function renderStudents(students) {

            if (
                !Array.isArray(students)
            ) {

                throw new Error(
                    "Invalid student data."
                );
            }


            if (
                students.length === 0
            ) {

                showEmptyState();

                return;
            }


            updateCounter(
                students.length
            );


            tableBody.innerHTML = "";


            students.forEach(student => {

                const row =
                    document.createElement("tr");


                row.innerHTML = `

                    <td>

                        <span class="student-id">
                            ${escapeHtml(
                                student.student_id
                            )}
                        </span>

                    </td>


                    <td>

                        <span class="student-name">
                            ${escapeHtml(
                                student.full_name
                            )}
                        </span>

                        <span class="student-email">
                            ${escapeHtml(
                                student.email
                            )}
                        </span>

                    </td>


                    <td>

                        <span class="student-course">
                            ${escapeHtml(
                                student.course
                            )}
                        </span>

                    </td>

                `;


                tableBody.appendChild(row);

            });
        }


        /* =====================================================
           GET STUDENTS FROM SUPABASE
        ===================================================== */

        async function fetchStudents() {

            showLoading();


            setConnectionStatus(
                "loading",
                "Connecting to Supabase..."
            );


            try {

                const {
                    data,
                    error
                } = await supabaseClient

                    .from(TABLE_NAME)

                    .select(
                        "student_id, full_name, email, course"
                    )

                    .order(
                        "student_id",
                        {
                            ascending: true
                        }
                    );


                /* ---------------------------------------------
                   SUPABASE ERROR
                --------------------------------------------- */

                if (error) {

                    throw error;
                }


                /* ---------------------------------------------
                   RENDER DATABASE DATA
                --------------------------------------------- */

                renderStudents(data);


                /* ---------------------------------------------
                   SUCCESS
                --------------------------------------------- */

                setConnectionStatus(
                    "success",
                    "Connected to Supabase"
                );


            } catch (error) {

                console.error(
                    "Supabase error:",
                    error
                );


                setConnectionStatus(
                    "error",
                    "Supabase connection failed"
                );


                showError(
                    "Unable to load student records."
                );

            }

        }


        /* =====================================================
           INITIALIZE
        ===================================================== */

        document.addEventListener(
            "DOMContentLoaded",
            fetchStudents
        );

    </script>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
