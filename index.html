<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Directory Dashboard</title>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --primary: #00b377;
            --border: #e5e7eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 3rem 1rem;
            line-height: 1.5;
        }

        .container { max-width: 800px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 2.5rem; }
        header h1 { color: var(--primary); font-size: 2.5rem; margin-bottom: 0.5rem; }
        header p { opacity: 0.7; font-size: 1.1rem; }

        #conn-check {
            display: inline-block;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            margin-top: 1rem;
            background: #e5e7eb;
            color: #4b5563;
        }
        .conn-success { background: #d1fae5 !important; color: #065f46 !important; }
        .conn-failed { background: #fee2e2 !important; color: #991b1b !important; }

        .directory-box {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }
        
        .directory-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid var(--border);
        }
        .directory-header h2 { font-size: 1.5rem; }
        .counter-badge {
            background: var(--primary);
            color: white;
            padding: 0.2rem 0.75rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 1rem; }
        th, td { padding: 1rem; border-bottom: 1px solid var(--border); }
        th { background: #f9fafb; font-weight: 600; color: #374151; }
        tr:hover { background-color: #f9fafb; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Student Registry System</h1>
        <p>Live Database Records Directory Viewer</p>
        <div id="conn-check">Connecting via Neon Serverless Edge Driver...</div>
    </header>

    <div class="directory-box">
        <div class="directory-header">
            <h2>Active Directory</h2>
            <div id="student-counter" class="counter-badge">0 Students</div>
        </div>

        <div class="table-container">
            <table id="studentTable">
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Student Profile Details</th>
                        <th>Enrolled Course</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="3" style="text-align:center; padding: 2rem; color: #6b7280;">
                            Loading records from database...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Import official Neon database serverless driver compiled for web browsers -->
<script type="module">
    import { neon } from 'https://jsdelivr.net';

    // 1. PLACE YOUR ORIGINAL DATABASE CONNECTION STRING HERE
    // Paste the full 'postgresql://neondb_owner:...' URL string copied from Neon dashboard
    const DATABASE_URL = 'postgresql://neondb_owner:npg_1G5WJkRdxTzF@ep-divine-breeze-16069843-pooler.us-east-2.aws.neon.tech/neondb?sslmode=require';

    const studentTableBody = document.querySelector('#studentTable tbody');
    const connCheckDiv = document.getElementById('conn-check');
    const counterBadge = document.getElementById('student-counter');

    async function fetchFromNeon() {
        try {
            if (DATABASE_URL.includes('PASTE_YOUR_CONNE')) {
                connCheckDiv.textContent = "⚠️ Action Required: Paste Connection Link";
                connCheckDiv.className = 'conn-failed';
                return;
            }

            // Establish the direct driver instance to handle cross-origin routing automatically
            const sql = neon(DATABASE_URL);

            // Execute the raw query safely through the edge websocket protocol tunnel
            const data = await sql(`
                SELECT student_id, full_name, email, course 
                FROM public.students 
                ORDER BY id DESC;
            `);

            connCheckDiv.textContent = "🟢 Connected live to Neon Data Layer";
            connCheckDiv.className = 'conn-success';

            if (!data || data.length === 0) {
                counterBadge.textContent = "0 Students";
                studentTableBody.innerHTML = `<tr><td colspan="3" style="text-align:center; padding: 2rem;">Connected, but table is empty.</td></tr>`;
                return;
            }

            counterBadge.textContent = `${data.length} Student${data.length > 1 ? 's' : ''}`;
            studentTableBody.innerHTML = '';
            
            data.forEach(student => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${escapeHtml(student.student_id)}</strong></td>
                    <td>
                        <span style="font-weight: 500;">${escapeHtml(student.full_name)}</span><br>
                        <small style="color: #6b7280;">${escapeHtml(student.email)}</small>
                    </td>
                    <td><span style="color: #00b377; font-weight: 500;">${escapeHtml(student.course)}</span></td>
                `;
                studentTableBody.appendChild(row);
            });

        } catch (err) {
            connCheckDiv.textContent = `❌ Error: ${err.message}`;
            connCheckDiv.className = 'conn-failed';
            studentTableBody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:red; padding: 2rem;">Could not load data records. Check database connections.</td></tr>`;
            console.error("Diagnostic Details:", err);
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.toString()
            .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Run the engine
    fetchFromNeon();
</script>
</body>
</html>
