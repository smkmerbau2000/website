<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Directory Dashboard</title>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --primary: #00b377;
            --border: #e5e7eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 3rem 1rem;
            line-height: 1.5;
        }

        .container { max-width: 800px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 2.5rem; }
        header h1 { color: var(--primary); font-size: 2.5rem; margin-bottom: 0.5rem; }
        header p { opacity: 0.7; font-size: 1.1rem; }

        #conn-check {
            display: inline-block;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            margin-top: 1rem;
            background: #e5e7eb;
            color: #4b5563;
        }
        .conn-success { background: #d1fae5 !important; color: #065f46 !important; }
        .conn-failed { background: #fee2e2 !important; color: #991b1b !important; }

        .directory-box {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }
        
        .directory-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid var(--border);
        }
        .directory-header h2 { font-size: 1.5rem; }
        .counter-badge {
            background: var(--primary);
            color: white;
            padding: 0.2rem 0.75rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 1rem; }
        th, td { padding: 1rem; border-bottom: 1px solid var(--border); }
        th { background: #f9fafb; font-weight: 600; color: #374151; }
        tr:hover { background-color: #f9fafb; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Student Registry System</h1>
        <p>Live Database Records Directory Viewer (Direct Neon Connection)</p>
        <div id="conn-check">Connecting to Neon Database...</div>
    </header>

    <div class="directory-box">
        <div class="directory-header">
            <h2>Active Directory</h2>
            <div id="student-counter" class="counter-badge">0 Students</div>
        </div>

        <div class="table-container">
            <table id="studentTable">
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Student Profile Details</th>
                        <th>Enrolled Course</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="3" style="text-align:center; padding: 2rem; color: #6b7280;">
                            Loading records directly from database...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // 1. Paste your regular database Connection String here from your Neon Dashboard
    // It looks like this: postgres://alex:password@ep-cool-pool-123456.us-east-2.aws.neon.tech/neondb
    const NEON_CONNECTION_STRING = 'postgresql://neondb_owner:npg_9nlUos7aeGdk@ep-tiny-cherry-b4epky7d-pooler.c-6.us-east-2.aws.neon.tech/neondb';

    const studentTableBody = document.querySelector('#studentTable tbody');
    const connCheckDiv = document.getElementById('conn-check');
    const counterBadge = document.getElementById('student-counter');

    async function fetchFromNeon() {
        try {
            if(NEON_CONNECTION_STRING.includes('PASTE_YOUR_POSTGRES')) {
                connCheckDiv.textContent = "⚠️ Action Required: Paste Connection String";
                connCheckDiv.className = 'conn-failed';
                return;
            }

            // Using Neon's public serverless proxy endpoint which bypasses CORS natively
            const publicApiUrl = `https://neon.tech`;

            const response = await fetch(publicApiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    connectionString: NEON_CONNECTION_STRING,
                    sql: "SELECT student_id, full_name, email, course FROM public.students ORDER BY id DESC;"
                })
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.message || `Server error code: ${response.status}`);
            }

            const result = await response.json();
            // The execute API returns matching structural columns inside a .rows object array
            const data = result.rows || [];

            connCheckDiv.textContent = "🟢 Connected live to Neon via Direct Web SQL Driver";
            connCheckDiv.className = 'conn-success';

            if (data.length === 0) {
                counterBadge.textContent = "0 Students";
                studentTableBody.innerHTML = `<tr><td colspan="3" style="text-align:center; padding: 2rem;">Connected, but table is empty.</td></tr>`;
                return;
            }

            counterBadge.textContent = `${data.length} Student${data.length > 1 ? 's' : ''}`;
            studentTableBody.innerHTML = '';
            
            data.forEach(student => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${escapeHtml(student.student_id)}</strong></td>
                    <td>
                        <span style="font-weight: 500;">${escapeHtml(student.full_name)}</span><br>
                        <small style="color: #6b7280;">${escapeHtml(student.email)}</small>
                    </td>
                    <td><span style="color: #00b377; font-weight: 500;">${escapeHtml(student.course)}</span></td>
                `;
                studentTableBody.appendChild(row);
            });

        } catch (err) {
            connCheckDiv.textContent = `❌ Error: ${err.message}`;
            connCheckDiv.className = 'conn-failed';
            studentTableBody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:red; padding: 2rem;">Could not load data records. Check database settings.</td></tr>`;
            console.error(err);
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.toString()
            .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    fetchFromNeon();
</script>
</body>
</html>
